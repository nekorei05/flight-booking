spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: flight
  datasource:
    url: jdbc:postgresql://localhost:5432/flight_db
    username: postgres
    password: flight-app
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
    secret: ${JWT_SECRET}
